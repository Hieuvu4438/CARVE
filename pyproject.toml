[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "clave"
version = "2.0.0"
description = "CLAVE: Cross-Fitted Clause-Level Argument Verification for Scientific Event Extraction (SciEvent)"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = [
    "torch>=2.4",
    "transformers>=4.44",
    "tokenizers>=0.19",
    "sentencepiece",
    "accelerate",
    "numpy",
    "scikit-learn",
    "rouge-score",
]

[project.urls]
Repository = "https://github.com/Hieuvu4438/CLAVE"

[tool.setuptools]
packages = ["clave"]
